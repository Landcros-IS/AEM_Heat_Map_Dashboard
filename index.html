<script>

const API_ENDPOINT   = 'https://aem-heat-map-api.azurewebsites.net/api/getAEMData';
const AZURE_MAPS_KEY = 'D2rj4Lkx4masQx5oO7bANUDBBDm8qLSgAAbH3jW7QdyRkS4CIbcpJQQJ99BEACYeBjFTRtVWAAAgAZMP4Mo0';
const DEFAULT_CENTER = [-96.5, 49.0];
const DEFAULT_ZOOM   = 3.5;
const MIN_ZOOM = 2.5, MAX_ZOOM = 18;
const NA_BOUNDS = [-168, 24, -52, 72.5];

const COUNTY_GEOJSON_URL = 'https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json';

const FIPS_TO_STATE = {
    '01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT',
    '10':'DE','11':'DC','12':'FL','13':'GA','15':'HI','16':'ID','17':'IL',

    '25':'MA','26':'MI','27':'MN','28':'MS','29':'MO','30':'MT','31':'NE',

// ── Colour ramp — matches Excel style: white → blush → rose → burgundy ────
function lerp(a,b,t){ return Math.round(a+(b-a)*Math.max(0,Math.min(1,t))); }
function normToColor(n){
    // 4-stop ramp matching the Excel screenshot
    const stops=[
        [0,   [252,232,232], 0],    // very light blush (transparent-ish)
        [0.2, [232,160,160], 0.7],  // light rose
        [0.5, [192, 80, 80], 0.85], // medium red
        [0.75,[150, 30, 30], 0.92], // deep red
        [1.0, [100,  0,  0], 0.97]  // dark burgundy
    ];
    for(let i=0;i<stops.length-1;i++){
        const [t0,c0,a0]=stops[i],[t1,c1,a1]=stops[i+1];
        if(n<=t1){
            const t=(n-t0)/(t1-t0);
            const r=lerp(c0[0],c1[0],t),g=lerp(c0[1],c1[1],t),b=lerp(c0[2],c1[2],t);
            const a=(a0+(a1-a0)*t).toFixed(2);
            return `rgba(${r},${g},${b},${a})`;
        }
    }
    return 'rgba(100,0,0,0.97)';
}

// ── Point-in-polygon (ray casting) ────────────────────────────────────────
function pointInPolygon(px, py, ring){
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
        const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
        if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
    }
    return inside;
}

function pointInFeature(lon, lat, feat){
    try{
        const geom=feat.geometry;
        if(!geom) return false;
        if(geom.type==='Polygon'){
            return pointInPolygon(lon,lat,geom.coordinates[0]);
        }
        if(geom.type==='MultiPolygon'){
            return geom.coordinates.some(poly=>pointInPolygon(lon,lat,poly[0]));
        }
    }catch(e){}
    return false;
}

// ── Build county label from GeoJSON props ─────────────────────────────────
function getCountyLabel(props){
    if(!props) return '';
    if(props.STATE!==undefined){
        const fips=String(props.STATE).padStart(2,'0');
        const abbr=FIPS_TO_STATE[fips]||'';
        const lsad=(props.LSAD||'').trim();
        const name=(props.NAME||'').trim();
        const suffix=lsad&&lsad!=='County'?' '+lsad:' County';
        return abbr?`${name}${suffix}, ${abbr}`:name;
    }
    return props.name||props.NAME||'';
}

// ── Map dealer lat/lon → GeoJSON county feature via point-in-polygon ──────
// Returns the index into allCountyFeatures, or -1 if not found.
// We build a bounding-box index first for speed.
function buildBBoxIndex(features){
    return features.map(feat=>{
        try{
            const geom=feat.geometry;
            let minLon=180,maxLon=-180,minLat=90,maxLat=-90;
            const processRing=ring=>{
                ring.forEach(([lo,la])=>{
                    if(lo<minLon)minLon=lo; if(lo>maxLon)maxLon=lo;
                    if(la<minLat)minLat=la; if(la>maxLat)maxLat=la;
                });
            };
            if(geom.type==='Polygon') geom.coordinates.forEach(processRing);
            else if(geom.type==='MultiPolygon') geom.coordinates.forEach(p=>p.forEach(processRing));
            return {minLon,maxLon,minLat,maxLat};
        }catch(e){return {minLon:0,maxLon:0,minLat:0,maxLat:0};}
    });
}

let bboxIndex=[];

function findCountyForPoint(lon,lat){
    for(let i=0;i<allCountyFeatures.length;i++){
        const b=bboxIndex[i];
        if(lon<b.minLon||lon>b.maxLon||lat<b.minLat||lat>b.maxLat) continue;
        if(pointInFeature(lon,lat,allCountyFeatures[i])) return i;
    }
    return -1;
}

// ── Map Init ───────────────────────────────────────────────────────────────
map = new atlas.Map('myMap',{
    center:DEFAULT_CENTER, zoom:DEFAULT_ZOOM,
    minZoom:MIN_ZOOM, maxZoom:MAX_ZOOM, maxBounds:NA_BOUNDS,
    style:'road', language:'en-US',
    authOptions:{authType:'subscriptionKey',subscriptionKey:AZURE_MAPS_KEY},
    showZoomControl:false, showPitchControl:false, showCompass:false
});

function zoomIn()    { map.setCamera({zoom:Math.min(map.getCamera().zoom+1,MAX_ZOOM),type:'ease',duration:300}); }
function zoomOut()   { map.setCamera({zoom:Math.max(map.getCamera().zoom-1,MIN_ZOOM),type:'ease',duration:300}); }
function resetView() { map.setCamera({center:DEFAULT_CENTER,zoom:DEFAULT_ZOOM,type:'ease',duration:800}); }
map.events.add('moveend',()=>{ document.getElementById('zoomDisplay').textContent=map.getCamera().zoom.toFixed(1); });
document.addEventListener('keydown',e=>{
    if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
    if(e.key==='+'||e.key==='=') zoomIn();
    if(e.key==='-'||e.key==='_') zoomOut();
    if(e.key==='0') resetView();
});
function setMapStyle(s){
    map.setStyle({style:s});
    document.getElementById('btnStreet').classList.toggle('active',s==='road');
    document.getElementById('btnSatellite').classList.toggle('active',s==='satellite_road_labels');
    document.getElementById('btnDark').classList.toggle('active',s==='night');
}

function isValidCoord(lat,lon){
    if(lat==null||lon==null) return false;
    const la=parseFloat(lat),lo=parseFloat(lon);
    if(isNaN(la)||isNaN(lo)||(la===0&&lo===0)) return false;
    return lo>=-170&&lo<=-30&&la>=-60&&la<=75;
}

// ── Fetch ──────────────────────────────────────────────────────────────────
async function fetchAEMData(){
    try{
        const res=await fetch(API_ENDPOINT,{method:'GET',headers:{'Content-Type':'application/json'}});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const d=await res.json(); return d.results||d;
    }catch(e){
        console.warn('[AEM] Sample data fallback:', e.message);
        return getSampleData();
    }
}

        {County:'Yavapai, AZ',Dealer_Id:'DES200',Equipment_Count:950,Latitude:'34.54',Longitude:'-112.4685',Model_Count:5,Nation:'United States',ParentDealerId:'DES200',ParentDealerName:'DESERT MACHINERY',Primary_CustomerType:'Contractor',Primary_Product:'Mining',RBM:'Glenn Young',State:'Arizona',Territory:'West',Total_MFG_Quantity:134,Total_MKT_Quantity:980},
        {County:'Cook, IL',Dealer_Id:'MID300',Equipment_Count:2100,Latitude:'41.878',Longitude:'-87.63',Model_Count:9,Nation:'United States',ParentDealerId:'MID300',ParentDealerName:'MIDWEST MACHINERY',Primary_CustomerType:'Contractor',Primary_Product:'Construction',RBM:'Paul Kindelspire',State:'Illinois',Territory:'Midwest',Total_MFG_Quantity:198,Total_MKT_Quantity:2150},
        {County:'Dallas, TX',Dealer_Id:'TEX400',Equipment_Count:3200,Latitude:'32.7767',Longitude:'-96.797',Model_Count:11,Nation:'United States',ParentDealerId:'TEX400',ParentDealerName:'TEXAS EQUIPMENT CO',Primary_CustomerType:'Contractor',Primary_Product:'Construction',RBM:'William Swartz',State:'Texas',Territory:'South',Total_MFG_Quantity:245,Total_MKT_Quantity:3300},
        {County:'Toronto, ON',Dealer_Id:'ONT500',Equipment_Count:1500,Latitude:'43.6532',Longitude:'-79.3832',Model_Count:6,Nation:'Canada',ParentDealerId:'ONT500',ParentDealerName:'ONTARIO EQUIPMENT',Primary_CustomerType:'Government',Primary_Product:'Construction',RBM:'Quoc Nguyen',State:'Ontario',Territory:'Canada',Total_MFG_Quantity:125,Total_MKT_Quantity:1550}

// ── Aggregate ──────────────────────────────────────────────────────────────
function aggregateByDealer(raw){
    const m=new Map();
    raw.forEach(r=>{
        const lat=parseFloat(r.Latitude),lon=parseFloat(r.Longitude);
        if(!isValidCoord(lat,lon)) return;
        const key=`${r.ParentDealerId||r.Dealer_Id}|${lat.toFixed(4)}|${lon.toFixed(4)}`;
        if(m.has(key)){
            const ex=m.get(key);
            ex.Total_MFG_Quantity+=(parseFloat(r.Total_MFG_Quantity)||0);
            ex.Total_MKT_Quantity+=(parseFloat(r.Total_MKT_Quantity)||0);
            ex.Equipment_Count   +=(parseFloat(r.Equipment_Count)||0);
        } else {
            m.set(key,{
                Latitude:lat, Longitude:lon,
                Total_MFG_Quantity:parseFloat(r.Total_MFG_Quantity)||0,
                Total_MKT_Quantity:parseFloat(r.Total_MKT_Quantity)||0,
                Equipment_Count:   parseFloat(r.Equipment_Count)||0,
                Model_Count:       parseFloat(r.Model_Count)||0,
                State:r.State||'', County:r.County||'', Nation:r.Nation||'',
                Territory:r.Territory||'', RBM:r.RBM||'',
                ParentDealerId:r.ParentDealerId||r.Dealer_Id||'',
                ParentDealerName:r.ParentDealerName||'',
                Primary_Product:r.Primary_Product||'',
                Primary_CustomerType:r.Primary_CustomerType||'',
                Segment:r.Primary_Product||r.Segment||'',
                Product_Level2:r.Product_Level2||r.Primary_Product||'',
                Summary:r.Summary||''
            });
        }
    });
    return Array.from(m.values());
}

// ── Build choropleth using point-in-polygon matching ───────────────────────
// For each dealer, find which GeoJSON county polygon contains their lat/lon,
// then colour that county polygon by total MFG units. No name matching needed.
function buildChoropleth(filtered){
    if(!choroplethSource||!allCountyFeatures.length) return;

    // Accumulate sales per county feature index
    const countySales={};  // { featureIndex: totalMFGQty }
    let matched=0, unmatched=0;

    filtered.forEach(d=>{
        const idx=findCountyForPoint(d.Longitude,d.Latitude);
        if(idx>=0){
            countySales[idx]=(countySales[idx]||0)+d.Total_MFG_Quantity;
            matched++;
        } else {
            unmatched++;
        }
    });

    console.log(`[AEM] Choropleth: ${matched} matched, ${unmatched} unmatched`);
    if(!Object.keys(countySales).length){ choroplethSource.clear(); return; }

    const maxQty=Math.max(1,...Object.values(countySales));

    // Build coloured features — only counties with sales data
    const coloredFeatures=Object.entries(countySales).map(([idxStr,qty])=>{
        const idx=parseInt(idxStr);
        const feat=allCountyFeatures[idx];
        const props=feat.properties||{};
        const norm=qty/maxQty;
        const fillColor=normToColor(norm);
        const label=getCountyLabel(props);
        return {
            ...feat,
            properties:{...props, qty, norm, fillColor, _countyLabel:label, _isChoropleth:true}
        };
    });

    choroplethSource.clear();
    choroplethSource.add({type:'FeatureCollection',features:coloredFeatures});
    console.log(`[AEM] Painted ${coloredFeatures.length} counties`);
}

// ── Load GeoJSON ───────────────────────────────────────────────────────────
async function loadBoundaries(){
    let usFeatures=[], canadaFeatures=[];

    try{
        setSub('Loading US county boundaries…');
        const r=await fetch(COUNTY_GEOJSON_URL);
        const g=await r.json();
        usFeatures=g.features||[];
        console.log('[AEM] US features:', usFeatures.length);
    }catch(e){ console.error('[AEM] US GeoJSON failed:',e); }

    try{
        setSub('Loading Canada boundaries…');
        const r=await fetch(CANADA_GEOJSON_URL);
        const g=await r.json();
        canadaFeatures=(g.features||[]).map(f=>({
            ...f,
            properties:{...f.properties, name:f.properties.name||f.properties.NAME||''}
        }));
        console.log('[AEM] Canada features:', canadaFeatures.length);
    }catch(e){ console.error('[AEM] Canada GeoJSON failed:',e); }

    allCountyFeatures=[...usFeatures,...canadaFeatures];

    setSub('Building spatial index…');
    bboxIndex=buildBBoxIndex(allCountyFeatures);

    // Also load county lines on the line source (all features, uncoloured)
    try{
        const allGeo={type:'FeatureCollection',features:allCountyFeatures.map(f=>({
            ...f,
            properties:{...f.properties,_countyLabel:getCountyLabel(f.properties)}
        }))};
        countyLineSource.add(allGeo);
    }catch(e){ console.error('[AEM] County line source failed:',e); }
}

// ── Init ───────────────────────────────────────────────────────────────────
async function initializeApp(){
    setLoadingText('Fetching AEM sales data…');
    const raw=await fetchAEMData();
    dealerData=aggregateByDealer(raw);
    console.log('[AEM] Dealers:', dealerData.length);

    dealerData.forEach(d=>{
        if(d.Nation)         allNations.add(d.Nation);
        if(d.State)          allStates.add(d.State);
        if(d.County)         allCounties.add(d.County);
        if(d.Territory)      allTerritories.add(d.Territory);
        if(d.RBM)            allRBMs.add(d.RBM);
        if(d.Segment)        allSegments.add(d.Segment);
        if(d.Product_Level2) allProducts.add(d.Product_Level2);
    });
    populateFilters();

    setLoadingText('Loading county boundaries…');
    await loadBoundaries();

    document.getElementById('loadingOverlay').classList.add('hidden');
    refreshMap(); updateStats(); updateRBMList();
}

function setLoadingText(t){ document.getElementById('loadingText').textContent=t; }
function setSub(t){ document.getElementById('loadingSub').textContent=t; }

function populateFilters(){
    populateDD('nationFilter',allNations); populateDD('stateFilter',allStates);
    populateDD('countyFilter',allCounties); populateDD('territoryFilter',allTerritories);
    populateDD('rbmFilter',allRBMs); populateDD('segmentFilter',allSegments);
    populateDD('productFilter',allProducts);
}
function populateDD(id,set){
    const sel=document.getElementById(id),cur=sel.value,first=sel.options[0];
    sel.innerHTML=''; sel.appendChild(first);
    [...set].sort().forEach(v=>{ const o=document.createElement('option'); o.value=o.textContent=v; if(v===cur)o.selected=true; sel.appendChild(o); });
}

// ── Map Ready ──────────────────────────────────────────────────────────────
map.events.add('ready',async()=>{

    // Choropleth fill source (coloured county polygons — only shaded counties)
    choroplethSource=new atlas.source.DataSource(null,{cluster:false});
    map.sources.add(choroplethSource);

    choroplethFillLayer=new atlas.layer.PolygonLayer(choroplethSource,'choroplethFill',{
        fillColor:['get','fillColor'],
        fillOpacity:1
    });
    map.layers.add(choroplethFillLayer,'labels');

    // County outline source (all counties, no fill — just lines + hover hit area)
    countyLineSource=new atlas.source.DataSource(null,{cluster:false});
    map.sources.add(countyLineSource);

    // Invisible hit-test polygon for hover tooltip
    choroplethHitLayer=new atlas.layer.PolygonLayer(countyLineSource,'countyHit',{
        fillColor:'rgba(0,0,0,0)',
        fillOpacity:1,
        minZoom:4
    });
    map.layers.add(choroplethHitLayer,'labels');

    // Visible county boundary lines
    countyLineLayer=new atlas.layer.LineLayer(countyLineSource,'countyLines',{
        strokeColor:'rgba(80,100,130,0.35)',
        strokeWidth:0.6,
        minZoom:4
    });
    map.layers.add(countyLineLayer,'labels');

    // Dealer source
    dealerSource=new atlas.source.DataSource();
    map.sources.add(dealerSource);

    dealerLayer=new atlas.layer.BubbleLayer(dealerSource,'dealerBubble',{
        radius:7, color:'#1a73e8', strokeColor:'#0d47a1', strokeWidth:2, opacity:0.95
    });
    map.layers.add(dealerLayer);

    labelLayer=new atlas.layer.SymbolLayer(dealerSource,'dealerLabel',{
        iconOptions:{image:'none'},
        textOptions:{textField:['get','ParentDealerName'],offset:[0,1.5],size:11,color:'#000',haloColor:'#fff',haloWidth:2,allowOverlap:false}
    });
    map.layers.add(labelLayer);
    labelLayer.setOptions({visible:false});

    popup=new atlas.Popup({pixelOffset:[0,-10],closeButton:true});

    // County hover tooltip
    const canvas=map.getCanvasContainer();

    function showCountyTooltip(e, source){
        if(!document.getElementById('toggleCountyLines').checked) return;
        if(e.shapes&&e.shapes.length>0){
            const props=e.shapes[0].getProperties();
            const label=props._countyLabel||props.NAME||props.name||'';
            if(!label) return;
            const qty=props.qty;
            tooltip.innerHTML=qty
                ? `<strong>${label}</strong><br><span style="font-weight:400;font-size:11px;">${Number(qty).toLocaleString()} MFG units</span>`
                : `<strong>${label}</strong>`;
            tooltip.style.display='block';
            const rect=canvas.getBoundingClientRect();
            tooltip.style.left=(e.originalEvent.clientX-rect.left+14)+'px';
            tooltip.style.top =(e.originalEvent.clientY-rect.top -34)+'px';
            canvas.style.cursor='crosshair';
        }
    }

    map.events.add('mousemove', choroplethHitLayer,  e=>showCountyTooltip(e,'line'));
    map.events.add('mousemove', choroplethFillLayer, e=>showCountyTooltip(e,'fill'));
    map.events.add('mouseleave',choroplethHitLayer,  ()=>{ tooltip.style.display='none'; canvas.style.cursor='grab'; });
    map.events.add('mouseleave',choroplethFillLayer, ()=>{ tooltip.style.display='none'; canvas.style.cursor='grab'; });

    map.events.add('click', dealerLayer, e=>{
        if(e.shapes&&e.shapes.length>0) showDealerPopup(e.shapes[0].getProperties());
    });
    map.events.add('mouseover', dealerLayer, ()=>{ canvas.style.cursor='pointer'; });
    map.events.add('mouseout',  dealerLayer, ()=>{ canvas.style.cursor='grab'; });

    await initializeApp();
});

// ── Refresh ────────────────────────────────────────────────────────────────
function refreshMap(){
    if(!dealerSource||!choroplethSource) return;
    const filtered=getFiltered();

    // Rebuild choropleth
    buildChoropleth(filtered);

    // Rebuild dealer pins
    dealerSource.clear();
    filtered.forEach(d=>{
        dealerSource.add(new atlas.data.Feature(new atlas.data.Point([d.Longitude,d.Latitude]),d));
    });
}

// ── Filters ────────────────────────────────────────────────────────────────
function applyFilters(){
    const state=document.getElementById('stateFilter').value;
    if(state){
        const cs=new Set();
        dealerData.filter(d=>d.State===state).forEach(d=>{ if(d.County)cs.add(d.County); });
        populateDD('countyFilter',cs);
    } else populateDD('countyFilter',allCounties);
    refreshMap(); updateStats(); updateRBMList(); zoomToFiltered();
}

function getFiltered(){
    const nation=document.getElementById('nationFilter').value,
          state=document.getElementById('stateFilter').value,
          county=document.getElementById('countyFilter').value,
          territory=document.getElementById('territoryFilter').value,
          rbm=document.getElementById('rbmFilter').value,
          segment=document.getElementById('segmentFilter').value,
          product=document.getElementById('productFilter').value;
    return dealerData.filter(d=>
        isValidCoord(d.Latitude,d.Longitude)&&
        (!nation||d.Nation===nation)&&(!state||d.State===state)&&
        (!county||d.County===county)&&(!territory||d.Territory===territory)&&
        (!rbm||d.RBM===rbm)&&(!segment||d.Segment===segment)&&
        (!product||d.Product_Level2===product)
    );
}

function zoomToFiltered(){
    const f=getFiltered();
    if(!f.length){resetView();return;}
    if(f.length===1){map.setCamera({center:[f[0].Longitude,f[0].Latitude],zoom:10,type:'ease',duration:1000});return;}
    const lons=f.map(d=>d.Longitude),lats=f.map(d=>d.Latitude);
    const minLon=Math.max(Math.min(...lons),-170),maxLon=Math.min(Math.max(...lons),-30);
    const minLat=Math.max(Math.min(...lats),-60), maxLat=Math.min(Math.max(...lats),75);
    if(minLon>=maxLon||minLat>=maxLat){resetView();return;}
    map.setCamera({bounds:[minLon,minLat,maxLon,maxLat],padding:80,type:'ease',duration:1000});
}

function updateStats(){
    const f=getFiltered();
    document.getElementById('totalDealers').textContent   = f.length;
    document.getElementById('totalUnits').textContent     = f.reduce((s,d)=>s+(d.Total_MFG_Quantity||0),0).toLocaleString();
    document.getElementById('totalEquipment').textContent = f.reduce((s,d)=>s+(d.Equipment_Count||0),0).toLocaleString();
    document.getElementById('totalMkt').textContent       = f.reduce((s,d)=>s+(d.Total_MKT_Quantity||0),0).toLocaleString();
}

function updateRBMList(){
    const f=getFiltered();
    const rbms=[...new Set(f.map(d=>d.RBM).filter(Boolean))].sort();
    const el=document.getElementById('rbmList'); el.innerHTML='';
    if(!rbms.length){const li=document.createElement('li');li.textContent='No RBMs';li.style.cssText='font-style:italic;color:#999';el.appendChild(li);return;}
    rbms.forEach(r=>{
        const cnt=f.filter(d=>d.RBM===r).length;
        const qty=f.filter(d=>d.RBM===r).reduce((s,d)=>s+(d.Total_MFG_Quantity||0),0);
        const li=document.createElement('li');
        li.innerHTML=`<strong>${r}</strong><br><small>${cnt} dealers · ${qty.toLocaleString()} units</small>`;
        el.appendChild(li);
    });
}

function toggleLayer(t){
    if(t==='choropleth'){
        const v=document.getElementById('toggleChoropleth').checked;
        choroplethFillLayer.setOptions({visible:v});
    }
    if(t==='countyLines'){
        const v=document.getElementById('toggleCountyLines').checked;
        countyLineLayer.setOptions({visible:v});
        choroplethHitLayer.setOptions({visible:v});
        if(!v) tooltip.style.display='none';
    }
    if(t==='pins')   dealerLayer.setOptions({visible:document.getElementById('togglePins').checked});
    if(t==='labels') labelLayer.setOptions({visible:document.getElementById('toggleLabels').checked});
}

function showDealerPopup(p){
    popup.setOptions({
        position:[p.Longitude,p.Latitude],
        content:`<div class="popup-content">
            <h3>${p.ParentDealerName}</h3>
            <div class="popup-row"><span class="popup-label">Dealer ID:</span><span class="popup-value">${p.ParentDealerId}</span></div>
            <div class="popup-row"><span class="popup-label">Location:</span><span class="popup-value">${p.County}</span></div>
            <div class="popup-row"><span class="popup-label">Territory:</span><span class="popup-value">${p.Territory}</span></div>
            <div class="popup-row"><span class="popup-label">RBM:</span><span class="popup-value">${p.RBM}</span></div>
            <div class="popup-row"><span class="popup-label">MFG Units:</span><span class="popup-value"><strong>${Number(p.Total_MFG_Quantity||0).toLocaleString()}</strong></span></div>
            <div class="popup-row"><span class="popup-label">Mkt Units:</span><span class="popup-value">${Number(p.Total_MKT_Quantity||0).toLocaleString()}</span></div>
            <div class="popup-row"><span class="popup-label">Equipment:</span><span class="popup-value">${Number(p.Equipment_Count||0).toLocaleString()}</span></div>
            <div class="popup-row"><span class="popup-label">Product:</span><span class="popup-value">${p.Primary_Product||p.Product_Level2||''}</span></div>
            <div class="popup-row"><span class="popup-label">Customer Type:</span><span class="popup-value">${p.Primary_CustomerType||''}</span></div>
        </div>`
    });
    popup.open(map);
}
