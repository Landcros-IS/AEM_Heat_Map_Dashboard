    // ====== AGGREGATE DATA BY DEALER LOCATION ======
    function aggregateDataByDealer(data) {
        const dealerMap = new Map();
        
        data.forEach(record => {
            const key = `${record.ParentDealerId}_${record.Latitude}_${record.Longitude}`;
            
            if (dealerMap.has(key)) {
                // Aggregate quantities for same location
                const existing = dealerMap.get(key);
                existing.MFG_Quantity += record.MFG_Quantity;
                existing.recordCount += 1;
            } else {
                // New dealer location
                dealerMap.set(key, {
                    ...record,
                    recordCount: 1
                });
            }
        });
        
        return Array.from(dealerMap.values());
    }

    // ====== INITIALIZE APPLICATION ======
    async function initializeApp() {
        try {
            // Fetch raw data
            const rawData = await fetchAEMDataFromSynapse();
            
            if (!rawData || rawData.length === 0) {
                throw new Error('No AEM data received');
            }

            console.log(`Loaded ${rawData.length} AEM records`);

            // Aggregate by dealer location
            dealerData = aggregateDataByDealer(rawData);
            console.log(`Aggregated to ${dealerData.length} dealer locations`);

            // Extract unique values for filters
            dealerData.forEach(dealer => {
                if (dealer.Nation) allNations.add(dealer.Nation);
                if (dealer.State) allStates.add(dealer.State);
                if (dealer.County) allCounties.add(dealer.County);
                if (dealer.Territory) allTerritories.add(dealer.Territory);
                if (dealer.RBM) allRBMs.add(dealer.RBM);
                if (dealer.Segment) allSegments.add(dealer.Segment);
                if (dealer.Product_Level2) allProducts.add(dealer.Product_Level2);
            });

            // Populate filter dropdowns
            populateFilters();

            // Hide loading overlay
            document.getElementById('loadingOverlay').classList.add('hidden');

        } catch (error) {
            console.error('Initialization error:', error);
            document.getElementById('loadingOverlay').innerHTML = 
                `<div class="error-message">
                    <strong>Error loading AEM data:</strong> ${error.message}<br><br>
                    Using sample data for demonstration. Please configure your Synapse connection.
                </div>`;
        }
    }

    // ====== POPULATE FILTER DROPDOWNS ======
    function populateFilters() {
        populateDropdown('nationFilter', allNations);
        populateDropdown('stateFilter', allStates);
        populateDropdown('countyFilter', allCounties);
        populateDropdown('territoryFilter', allTerritories);
        populateDropdown('rbmFilter', allRBMs);
        populateDropdown('segmentFilter', allSegments);
        populateDropdown('productFilter', allProducts);
    }

    function populateDropdown(elementId, valueSet) {
        const select = document.getElementById(elementId);
        const currentValue = select.value;
        
        // Keep first option (All)
        const firstOption = select.options[0];
        select.innerHTML = '';
        select.appendChild(firstOption);
        
        // Add sorted options
        [...valueSet].sort().forEach(value => {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = value;
            if (value === currentValue) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });
    }

    // ====== SETUP MAP LAYERS ======
    map.events.add('ready', async function () {
        // Initialize app and load data
        await initializeApp();

        // Create data source
        dealerSource = new atlas.source.DataSource();
        map.sources.add(dealerSource);

        // HEAT MAP LAYER - FIXED: Azure Maps doesn't support data expressions in heat maps
        // We'll use a simpler configuration
        heatLayer = new atlas.layer.HeatMapLayer(dealerSource, null, {
            radius: 30,
            opacity: 0.8,
            intensity: 0.6,
            // Simple color gradient (no data expressions)
            color: [
                'interpolate',
                ['linear'],
                ['heatmap-density'],
                0, 'rgba(255, 255, 255, 0)',
                0.2, 'rgba(255, 220, 220, 0.6)',
                0.4, 'rgba(255, 180, 180, 0.75)',
                0.6, 'rgba(220, 100, 100, 0.85)',
                0.8, 'rgba(180, 50, 50, 0.95)',
                1, 'rgba(139, 0, 0, 1)'
            ]
        });
        map.layers.add(heatLayer, 'labels');

        // DEALER PIN LAYER (middle layer)
        dealerLayer = new atlas.layer.SymbolLayer(dealerSource, null, {
            iconOptions: { 
                image: 'marker-blue',
                anchor: 'bottom',
                size: 0.8,
                allowOverlap: true
            },
            textOptions: { 
                textField: '', // Hidden by default
                offset: [0, -1.5],
                size: 10,
                color: '#000000',
                haloColor: '#ffffff',
                haloWidth: 2,
                allowOverlap: false
            }
        });
        map.layers.add(dealerLayer);

        // LABEL LAYER (top layer, hidden by default)
        labelLayer = new atlas.layer.SymbolLayer(dealerSource, 'labelLayer', {
            iconOptions: { 
                image: 'none'
            },
            textOptions: { 
                textField: ['get', 'ParentDealerName'],
                offset: [0, 1.5],
                size: 11,
                color: '#000000',
                haloColor: '#ffffff',
                haloWidth: 2,
                allowOverlap: false
            }
        });
        map.layers.add(labelLayer);
        labelLayer.setOptions({ visible: false });

        // Create popup
        popup = new atlas.Popup({ 
            pixelOffset: [0, -30],
            closeButton: true
        });

        // Popup on click
        map.events.add('click', dealerLayer, function(e) {
            if (e.shapes && e.shapes.length > 0) {
                const props = e.shapes[0].getProperties();
                showDealerPopup(props);
            }
        });

        // Change cursor on hover
        map.events.add('mouseover', dealerLayer, function() {
            map.getCanvasContainer().style.cursor = 'pointer';
        });

        map.events.add('mouseout', dealerLayer, function() {
            map.getCanvasContainer().style.cursor = 'grab';
        });

        // Load dealer points
        loadDealersToMap();

        // Initialize displays
        updateRBMList();
        updateStatistics();
    });

    // ====== SHOW DEALER POPUP ======
    function showDealerPopup(props) {
        popup.setOptions({
            position: [props.Longitude, props.Latitude],
            content: `
                <div class="popup-content">
                    <h3>${props.ParentDealerName}</h3>
                    <div class="popup-row">
                        <span class="popup-label">Dealer ID:</span>
                        <span class="popup-value">${props.ParentDealerId}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Location:</span>
                        <span class="popup-value">${props.County}, ${props.State}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Territory:</span>
                        <span class="popup-value">${props.Territory}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">RBM:</span>
                        <span class="popup-value">${props.RBM}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Total Quantity:</span>
                        <span class="popup-value"><strong>${props.Total_MFG_Quantity || props.MFG_Quantity || 'N/A'}</strong> units</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Segment:</span>
                        <span class="popup-value">${props.Segment}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Product:</span>
                        <span class="popup-value">${props.Product_Level2}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Type:</span>
                        <span class="popup-value">${props.Summary}</span>
                    </div>
                </div>
            `
        });
        popup.open(map);
    }

    // ====== LOAD DEALERS TO MAP ======
    function loadDealersToMap() {
        dealerSource.clear();
        
        dealerData.forEach(d => {
            if (d.Latitude && d.Longitude) {
                dealerSource.add(new atlas.data.Feature(
                    new atlas.data.Point([d.Longitude, d.Latitude]), 
                    d
                ));
            }
        });
    }

    // ====== APPLY FILTERS ======
    function applyFilters() {
        const nation = document.getElementById('nationFilter').value;
        const state = document.getElementById('stateFilter').value;
        const county = document.getElementById('countyFilter').value;
        const territory = document.getElementById('territoryFilter').value;
        const rbm = document.getElementById('rbmFilter').value;
        const segment = document.getElementById('segmentFilter').value;
        const product = document.getElementById('productFilter').value;

        // Update county filter based on state
        if (state) {
            const countiesInState = new Set();
            dealerData
                .filter(d => d.State === state)
                .forEach(d => {
                    if (d.County) countiesInState.add(d.County);
                });
            populateDropdown('countyFilter', countiesInState);
        } else {
            populateDropdown('countyFilter', allCounties);
        }

        // Build filter expression
        const filterConditions = ['all'];
        
        if (nation) filterConditions.push(['==', ['get', 'Nation'], nation]);
        if (state) filterConditions.push(['==', ['get', 'State'], state]);
        if (county) filterConditions.push(['==', ['get', 'County'], county]);
        if (territory) filterConditions.push(['==', ['get', 'Territory'], territory]);
        if (rbm) filterConditions.push(['==', ['get', 'RBM'], rbm]);
        if (segment) filterConditions.push(['==', ['get', 'Segment'], segment]);
        if (product) filterConditions.push(['==', ['get', 'Product_Level2'], product]);

        // Apply filter to all layers
        dealerLayer.setOptions({ filter: filterConditions });
        heatLayer.setOptions({ filter: filterConditions });
        labelLayer.setOptions({ filter: filterConditions });

        // Update displays
        updateRBMList();
        updateStatistics();

        // Auto-zoom to filtered dealers
        zoomToFilteredDealers(nation, state, county, territory, rbm, segment, product);
    }

    // ====== UPDATE RBM LIST ======
    function updateRBMList() {
        const filtered = getFilteredDealers();
        const rbms = [...new Set(filtered.map(d => d.RBM))].sort();
        const rbmListEl = document.getElementById('rbmList');
        
        rbmListEl.innerHTML = '';
        
        if (rbms.length === 0) {
            const li = document.createElement('li');
            li.textContent = 'No RBMs in filter';
            li.style.fontStyle = 'italic';
            li.style.color = '#999';
            rbmListEl.appendChild(li);
        } else {
            rbms.forEach(rbm => {
                const dealerCount = filtered.filter(d => d.RBM === rbm).length;
                const totalQty = filtered
                    .filter(d => d.RBM === rbm)
                    .reduce((sum, d) => sum + (d.Total_MFG_Quantity || d.MFG_Quantity || 0), 0);
                
                const li = document.createElement('li');
                li.innerHTML = `<strong>${rbm}</strong><br>
                    <small>${dealerCount} dealers • ${totalQty} units</small>`;
                rbmListEl.appendChild(li);
            });
        }
    }

    // ====== UPDATE STATISTICS ======
    function updateStatistics() {
        const filtered = getFilteredDealers();
        
        const totalDealers = filtered.length;
        // Handle both field names (Total_MFG_Quantity from API or MFG_Quantity from sample data)
        const totalQuantity = filtered.reduce((sum, d) => sum + (d.Total_MFG_Quantity || d.MFG_Quantity || 0), 0);
        
        document.getElementById('totalDealers').textContent = totalDealers;
        document.getElementById('totalQuantity').textContent = totalQuantity.toLocaleString();
    }

    // ====== GET FILTERED DEALERS ======
    function getFilteredDealers() {
        const nation = document.getElementById('nationFilter').value;
        const state = document.getElementById('stateFilter').value;
        const county = document.getElementById('countyFilter').value;
        const territory = document.getElementById('territoryFilter').value;
        const rbm = document.getElementById('rbmFilter').value;
        const segment = document.getElementById('segmentFilter').value;
        const product = document.getElementById('productFilter').value;

        return dealerData.filter(d =>
            (!nation || d.Nation === nation) &&
            (!state || d.State === state) &&
            (!county || d.County === county) &&
            (!territory || d.Territory === territory) &&
            (!rbm || d.RBM === rbm) &&
            (!segment || d.Segment === segment) &&
            (!product || d.Product_Level2 === product)
        );
    }

    // ====== ZOOM TO FILTERED DEALERS ======
    function zoomToFilteredDealers(nation, state, county, territory, rbm, segment, product) {
        const filtered = getFilteredDealers();

        if (filtered.length === 0) return;

        if (filtered.length === 1) {
            map.setCamera({
                center: [filtered[0].Longitude, filtered[0].Latitude],
                zoom: 10,
                type: 'ease',
                duration: 1000
            });
        } else {
            const positions = filtered.map(d => [d.Longitude, d.Latitude]);
            const bounds = atlas.data.BoundingBox.fromPositions(positions);
            map.setCamera({
                bounds: bounds,
                padding: 80,
                type: 'ease',
                duration: 1000
            });
        }
    }

    // ====== TOGGLE LAYERS ======
    function toggleLayer(layerType) {
        switch(layerType) {
            case 'pins':
                const pinsEnabled = document.getElementById('togglePins').checked;
                dealerLayer.setOptions({ visible: pinsEnabled });
                break;
            case 'heat':
                const heatEnabled = document.getElementById('toggleHeat').checked;
                heatLayer.setOptions({ visible: heatEnabled });
                break;
            case 'labels':
                const labelsEnabled = document.getElementById('toggleLabels').checked;
                labelLayer.setOptions({ visible: labelsEnabled });
                break;
        }
    }
</script>
