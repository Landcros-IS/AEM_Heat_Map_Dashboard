// ── Validate that a coordinate is actually in the Americas ────────────────
function isValidCoord(lat, lon) {
    if (lat == null || lon == null) return false;
    const la = parseFloat(lat);
    const lo = parseFloat(lon);
    if (isNaN(la) || isNaN(lo)) return false;
    if (la === 0 && lo === 0)   return false;   // classic null-island sentinel
    return (
        lo >= AMERICAS_LON_MIN && lo <= AMERICAS_LON_MAX &&
        la >= AMERICAS_LAT_MIN && la <= AMERICAS_LAT_MAX
    );
}

// ── Aggregate ─────────────────────────────────────────────────────────────
function aggregateByDealer(data) {
    const m = new Map();
    data.forEach(r => {
        // Skip records with bad coordinates immediately at ingest
        if (!isValidCoord(r.Latitude, r.Longitude)) return;
        const k = `${r.ParentDealerId}_${r.Latitude}_${r.Longitude}`;
        if (m.has(k)) m.get(k).MFG_Quantity += (r.MFG_Quantity || 0);
        else m.set(k, { ...r, MFG_Quantity: r.MFG_Quantity || 0, recordCount: 1 });
    });
    return Array.from(m.values());
}

// ── Colour helpers ────────────────────────────────────────────────────────
function lerp(a, b, t) { return Math.round(a + (b-a) * Math.min(1, Math.max(0, t))); }

function normToColor(norm) {
    const stops = [
        [0,    [253,232,232], 0.72],
        [0.25, [244,160,160], 0.78],
        [0.5,  [212, 90, 90], 0.84],
        [0.75, [178, 34, 34], 0.90],
        [1.0,  [139,  0,  0], 0.94]
    ];
    for (let i = 0; i < stops.length - 1; i++) {
        const [t0, c0, a0] = stops[i];
        const [t1, c1, a1] = stops[i+1];
        if (norm <= t1) {
            const t = (norm - t0) / (t1 - t0);
            return `rgba(${lerp(c0[0],c1[0],t)},${lerp(c0[1],c1[1],t)},${lerp(c0[2],c1[2],t)},${(a0+(a1-a0)*t).toFixed(2)})`;
        }
    }
    return 'rgba(139,0,0,0.94)';
}

// ── Build county polygon features ─────────────────────────────────────────
function buildCountyFeatures(filtered) {
    const groups = {};
    filtered.forEach(r => {
        const k = `${r.State}|${r.County}`;
        if (!groups[k]) groups[k] = { lat: parseFloat(r.Latitude), lon: parseFloat(r.Longitude), qty: 0, county: r.County, state: r.State };
        groups[k].qty += (r.MFG_Quantity || 0);
    });

    const vals = Object.values(groups);
    const maxQty = Math.max(1, ...vals.map(c => c.qty));

    return vals.map(c => {
        const norm  = c.qty / maxQty;
        const color = normToColor(norm);
        const deg   = 0.38;
        const box   = [
            [c.lon-deg, c.lat-deg],
            [c.lon+deg, c.lat-deg],
            [c.lon+deg, c.lat+deg],
            [c.lon-deg, c.lat+deg],
            [c.lon-deg, c.lat-deg]
        ];
        return new atlas.data.Feature(
            new atlas.data.Polygon([box]),
            { qty: c.qty, norm, county: c.county, state: c.state, fillColor: color }
        );
    });
}

// ── Init ──────────────────────────────────────────────────────────────────
async function initializeApp() {
    try {
        const raw = await fetchAEMData();
        if (!raw || !raw.length) throw new Error('No data received');

        dealerData = aggregateByDealer(raw);

        dealerData.forEach(d => {
            if (d.Nation)         allNations.add(d.Nation);
            if (d.State)          allStates.add(d.State);
            if (d.County)         allCounties.add(d.County);
            if (d.Territory)      allTerritories.add(d.Territory);
            if (d.RBM)            allRBMs.add(d.RBM);
            if (d.Segment)        allSegments.add(d.Segment);
            if (d.Product_Level2) allProducts.add(d.Product_Level2);
        });

        populateFilters();
        document.getElementById('loadingOverlay').classList.add('hidden');
    } catch(e) {
        document.getElementById('loadingOverlay').innerHTML =
            `<div style="background:#fee;color:#c33;padding:15px;border-radius:8px;border:1px solid #fcc;margin:20px;">
                <strong>Error:</strong> ${e.message}
            </div>`;
    }

function populateFilters() {
    populateDD('nationFilter',    allNations);
    populateDD('stateFilter',     allStates);
    populateDD('countyFilter',    allCounties);
    populateDD('territoryFilter', allTerritories);
    populateDD('rbmFilter',       allRBMs);
    populateDD('segmentFilter',   allSegments);
    populateDD('productFilter',   allProducts);
    refreshMap();
}

function populateDD(id, set) {
    const sel = document.getElementById(id);
    const cur = sel.value, first = sel.options[0];
    sel.innerHTML = ''; sel.appendChild(first);
    [...set].sort().forEach(v => {
        const o = document.createElement('option');
        o.value = o.textContent = v;
        if (v === cur) o.selected = true;
        sel.appendChild(o);
    });
}

// ── Map Ready ─────────────────────────────────────────────────────────────
map.events.add('ready', async () => {
    await initializeApp();

    countySource = new atlas.source.DataSource();
    map.sources.add(countySource);

    countyFillLayer = new atlas.layer.PolygonLayer(countySource, null, {
        fillColor: ['get', 'fillColor'],
        fillOpacity: 1
    });
    map.layers.add(countyFillLayer, 'labels');

    countyLineLayer = new atlas.layer.LineLayer(countySource, null, {
        strokeColor: 'rgba(255,255,255,0.5)',
        strokeWidth: 0.8
    });
    map.layers.add(countyLineLayer, 'labels');

    dealerSource = new atlas.source.DataSource();
    map.sources.add(dealerSource);

    dealerLayer = new atlas.layer.BubbleLayer(dealerSource, null, {
        radius: 8,
        color: '#1a73e8',
        strokeColor: '#0d47a1',
        strokeWidth: 2,
        opacity: 0.95
    });
    map.layers.add(dealerLayer);

    labelLayer = new atlas.layer.SymbolLayer(dealerSource, 'labelLayer', {
        iconOptions: { image: 'none' },
        textOptions: {
            textField: ['get', 'ParentDealerName'],
            offset: [0, 1.5], size: 11,
            color: '#000000', haloColor: '#ffffff', haloWidth: 2, allowOverlap: false
        }
    });
    map.layers.add(labelLayer);
    labelLayer.setOptions({ visible: false });

    popup = new atlas.Popup({ pixelOffset: [0, -12], closeButton: true });

    map.events.add('click', dealerLayer, e => {
        if (e.shapes && e.shapes.length > 0) showDealerPopup(e.shapes[0].getProperties());
    });

    map.events.add('click', countyFillLayer, e => {
        if (e.shapes && e.shapes.length > 0) {
            const p = e.shapes[0].getProperties();
            popup.setOptions({
                position: e.position,
                content: `<div class="popup-content">
                    <h3>${p.county}, ${p.state}</h3>
                    <div class="popup-row">
                        <span class="popup-label">County Total Sales:</span>
                        <span class="popup-value"><strong>${Number(p.qty).toLocaleString()}</strong> units</span>
                    </div>
                </div>`
            });
            popup.open(map);
        }
    });

    map.events.add('mouseover', dealerLayer,     () => { map.getCanvasContainer().style.cursor = 'pointer'; });
    map.events.add('mouseout',  dealerLayer,     () => { map.getCanvasContainer().style.cursor = 'grab'; });
    map.events.add('mouseover', countyFillLayer, () => { map.getCanvasContainer().style.cursor = 'crosshair'; });
    map.events.add('mouseout',  countyFillLayer, () => { map.getCanvasContainer().style.cursor = 'grab'; });

    refreshMap();
    updateStats();
    updateRBMList();
});

// ── Show dealer popup ─────────────────────────────────────────────────────
function showDealerPopup(p) {
    popup.setOptions({
        position: [p.Longitude, p.Latitude],
        content: `<div class="popup-content">
            <h3>${p.ParentDealerName}</h3>
            <div class="popup-row"><span class="popup-label">Dealer ID:</span><span class="popup-value">${p.ParentDealerId}</span></div>
            <div class="popup-row"><span class="popup-label">Location:</span><span class="popup-value">${p.County}, ${p.State}</span></div>
            <div class="popup-row"><span class="popup-label">Territory:</span><span class="popup-value">${p.Territory}</span></div>
            <div class="popup-row"><span class="popup-label">RBM:</span><span class="popup-value">${p.RBM}</span></div>
            <div class="popup-row"><span class="popup-label">Units:</span><span class="popup-value"><strong>${Number(p.MFG_Quantity||0).toLocaleString()}</strong></span></div>
            <div class="popup-row"><span class="popup-label">Segment:</span><span class="popup-value">${p.Segment}</span></div>
            <div class="popup-row"><span class="popup-label">Product:</span><span class="popup-value">${p.Product_Level2}</span></div>
            <div class="popup-row"><span class="popup-label">Type:</span><span class="popup-value">${p.Summary}</span></div>
        </div>`
    });
    popup.open(map);
}

// ── Refresh map ───────────────────────────────────────────────────────────
function refreshMap() {
    if (!countySource || !dealerSource) return;
    const filtered = getFiltered();

    countySource.clear();
    const features = buildCountyFeatures(filtered);
    if (features.length) countySource.add(features);

    dealerSource.clear();
    filtered.forEach(d => {
        dealerSource.add(new atlas.data.Feature(
            new atlas.data.Point([parseFloat(d.Longitude), parseFloat(d.Latitude)]), d
        ));
    });
}

// ── Apply filters ─────────────────────────────────────────────────────────
function applyFilters() {
    const state = document.getElementById('stateFilter').value;
    if (state) {
        const cs = new Set();
        dealerData.filter(d => d.State === state).forEach(d => { if (d.County) cs.add(d.County); });
        populateDD('countyFilter', cs);
    } else {
        populateDD('countyFilter', allCounties);
    }
    refreshMap();
    updateStats();
    updateRBMList();
    zoomToFiltered();
}

// ── Get filtered dealers — always validates coords before returning ────────
function getFiltered() {
    const nation    = document.getElementById('nationFilter').value;
    const state     = document.getElementById('stateFilter').value;
    const county    = document.getElementById('countyFilter').value;
    const territory = document.getElementById('territoryFilter').value;
    const rbm       = document.getElementById('rbmFilter').value;
    const segment   = document.getElementById('segmentFilter').value;
    const product   = document.getElementById('productFilter').value;

    return dealerData.filter(d =>
        isValidCoord(d.Latitude, d.Longitude) &&   // <-- always sanity-check coords
        (!nation    || d.Nation         === nation)    &&
        (!state     || d.State          === state)     &&
        (!county    || d.County         === county)    &&
        (!territory || d.Territory      === territory) &&
        (!rbm       || d.RBM            === rbm)       &&
        (!segment   || d.Segment        === segment)   &&
        (!product   || d.Product_Level2 === product)
    );
}

// ── Zoom to filtered — with Americas sanity clamp ─────────────────────────
function zoomToFiltered() {
    const f = getFiltered();

    // If nothing valid, just reset to North America default
    if (!f.length) {
        resetView();
        return;
    }

    if (f.length === 1) {
        map.setCamera({
            center: [parseFloat(f[0].Longitude), parseFloat(f[0].Latitude)],
            zoom: 10,
            type: 'ease',
            duration: 1000
        });
        return;
    }

    // Build bounding box only from valid coordinates
    const lons = f.map(d => parseFloat(d.Longitude));
    const lats = f.map(d => parseFloat(d.Latitude));

    const minLon = Math.max(Math.min(...lons), AMERICAS_LON_MIN);
    const maxLon = Math.min(Math.max(...lons), AMERICAS_LON_MAX);
    const minLat = Math.max(Math.min(...lats), AMERICAS_LAT_MIN);
    const maxLat = Math.min(Math.max(...lats), AMERICAS_LAT_MAX);

    // Extra sanity: if the resulting box is still nonsense, reset
    if (minLon >= maxLon || minLat >= maxLat) {
        resetView();
        return;
    }

    const bounds = [minLon, minLat, maxLon, maxLat];
    map.setCamera({ bounds, padding: 80, type: 'ease', duration: 1000 });
}

// ── Stats & RBM list ──────────────────────────────────────────────────────
function updateStats() {
    const f = getFiltered();
    document.getElementById('totalDealers').textContent  = f.length;
    document.getElementById('totalQuantity').textContent = f.reduce((s,d) => s+(d.MFG_Quantity||0), 0).toLocaleString();
}

function updateRBMList() {
    const f = getFiltered();
    const rbms = [...new Set(f.map(d => d.RBM))].sort();
    const el = document.getElementById('rbmList');
    el.innerHTML = '';
    if (!rbms.length) {
        const li = document.createElement('li');
        li.textContent = 'No RBMs in filter';
        li.style.cssText = 'font-style:italic;color:#999';
        el.appendChild(li);
        return;
    }
    rbms.forEach(r => {
        const cnt = f.filter(d => d.RBM === r).length;
        const qty = f.filter(d => d.RBM === r).reduce((s,d) => s+(d.MFG_Quantity||0), 0);
        const li = document.createElement('li');
        li.innerHTML = `<strong>${r}</strong><br><small>${cnt} dealers · ${qty.toLocaleString()} units</small>`;
        el.appendChild(li);
    });
}

// ── Toggle layers ─────────────────────────────────────────────────────────
function toggleLayer(type) {
    if (type === 'county') {
        const v = document.getElementById('toggleCounty').checked;
        countyFillLayer.setOptions({ visible: v });
        countyLineLayer.setOptions({ visible: v });
    }
    if (type === 'pins')   dealerLayer.setOptions({ visible: document.getElementById('togglePins').checked });
    if (type === 'labels') labelLayer.setOptions({  visible: document.getElementById('toggleLabels').checked });
}
